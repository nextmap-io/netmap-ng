# TODO(P3-1): pin third-party actions to commit SHAs (deferred).
name: Cleanup old container images

# Runs weekly and on-demand to remove old container image versions.
# Defaults are conservative: keep the 60 most recent versions and only
# delete pre-release versions automatically.
on:
  schedule:
    - cron: "0 3 * * 0" # Every Sunday at 3am UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    name: Delete old images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package: [netmap-ng-backend, netmap-ng-frontend]
    steps:
      - name: Delete old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 60
          delete-only-pre-release-versions: true
          token: ${{ secrets.GITHUB_TOKEN }}

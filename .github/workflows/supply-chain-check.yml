name: Supply Chain Check

# Verify dependencies are not too recent (>7 days old) to mitigate
# supply chain attacks via compromised fresh packages.
#
# - npm: checks resolved versions from package-lock.json.
# - pip: checks the version floor (>=, ==, ~=) declared in requirements.txt,
#        not the latest on PyPI (which would fail unrelated PRs whenever any
#        listed package publishes a fresh release).
#
# Each sub-check is gated on whether its lockfile/requirements file changed,
# so an npm-only PR does not fail on pip and vice versa.

on:
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      npm: ${{ steps.filter.outputs.npm }}
      pip: ${{ steps.filter.outputs.pip }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            npm:
              - 'frontend/package-lock.json'
            pip:
              - 'backend/requirements.txt'

  check-npm-package-age:
    name: Check npm package age
    needs: detect-changes
    if: needs.detect-changes.outputs.npm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Check for packages published less than 7 days ago
        run: |
          echo "Checking npm package publication dates..."
          MIN_AGE_DAYS=7
          FAILED=0

          # Extract direct deps from package-lock.json
          node -e "
            const lock = require('./package-lock.json');
            const directDeps = Object.keys({
              ...(lock.packages?.['']?.dependencies || {}),
              ...(lock.packages?.['']?.devDependencies || {})
            });
            directDeps.forEach(d => console.log(d));
          " | while read -r pkg; do
            if [ -z "$pkg" ]; then continue; fi

            VERSION=$(node -e "
              const lock = require('./package-lock.json');
              const entry = lock.packages?.['node_modules/$pkg'];
              if (entry) console.log(entry.version || '');
            " 2>/dev/null)

            if [ -z "$VERSION" ]; then continue; fi

            PUBLISH_DATE=$(npm view "$pkg@$VERSION" time --json 2>/dev/null | node -e "
              let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{
                try {
                  const t=JSON.parse(d);
                  console.log(t['$VERSION'] || '');
                } catch(e) { console.log(''); }
              });
            " 2>/dev/null)

            if [ -z "$PUBLISH_DATE" ]; then continue; fi

            PUBLISH_TS=$(date -d "$PUBLISH_DATE" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%S" "${PUBLISH_DATE%%.*}" +%s 2>/dev/null || echo 0)
            NOW_TS=$(date +%s)
            AGE_DAYS=$(( (NOW_TS - PUBLISH_TS) / 86400 ))

            if [ "$AGE_DAYS" -lt "$MIN_AGE_DAYS" ] && [ "$AGE_DAYS" -ge 0 ]; then
              echo "::error::SUPPLY CHAIN WARNING: $pkg@$VERSION was published only $AGE_DAYS days ago (minimum: $MIN_AGE_DAYS)"
              FAILED=1
            fi
          done

          if [ "$FAILED" = "1" ]; then
            echo ""
            echo "::error::One or more packages were published less than $MIN_AGE_DAYS days ago."
            echo "This could indicate a supply chain attack. Please wait or investigate."
            exit 1
          fi

          echo "✓ All direct dependencies are older than $MIN_AGE_DAYS days"

  check-pip-package-age:
    name: Check pip package age
    needs: detect-changes
    if: needs.detect-changes.outputs.pip == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check for packages published less than 7 days ago
        run: |
          echo "Checking pip package publication dates (against version floor in requirements.txt)..."
          MIN_AGE_DAYS=7
          FAILED=0

          while IFS= read -r line; do
            [[ "$line" =~ ^#.*$ ]] && continue
            [[ -z "$line" ]] && continue

            parsed=$(LINE="$line" python3 - <<'PY' 2>/dev/null
          import os, re
          line = os.environ.get("LINE", "").strip()
          line = re.sub(r"\[.*?\]", "", line)
          m = re.match(r"^([A-Za-z0-9_.-]+)\s*(?:>=|==|~=)\s*([0-9][A-Za-z0-9_.+-]*)", line)
          if m:
              print(m.group(1), m.group(2))
          PY
          )
            PKG=$(echo "$parsed" | awk '{print $1}')
            VERSION=$(echo "$parsed" | awk '{print $2}')
            [ -z "$PKG" ] && continue
            [ -z "$VERSION" ] && continue

            UPLOAD_DATE=$(curl -s "https://pypi.org/pypi/$PKG/$VERSION/json" 2>/dev/null | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              urls = data.get('urls', [])
              if urls:
                  print(urls[0]['upload_time'][:10])
          except Exception:
              pass
          " 2>/dev/null)

            if [ -z "$UPLOAD_DATE" ]; then continue; fi

            UPLOAD_TS=$(date -d "$UPLOAD_DATE" +%s 2>/dev/null || echo 0)
            NOW_TS=$(date +%s)
            AGE_DAYS=$(( (NOW_TS - UPLOAD_TS) / 86400 ))

            if [ "$AGE_DAYS" -lt "$MIN_AGE_DAYS" ] && [ "$AGE_DAYS" -ge 0 ]; then
              echo "::error::SUPPLY CHAIN WARNING: $PKG $VERSION was published only $AGE_DAYS days ago (minimum: $MIN_AGE_DAYS)"
              FAILED=1
            fi
          done < backend/requirements.txt

          if [ "$FAILED" = "1" ]; then
            echo ""
            echo "::error::One or more pinned versions were published less than $MIN_AGE_DAYS days ago."
            echo "This could indicate a supply chain attack. Please wait or investigate."
            exit 1
          fi

          echo "✓ All pinned versions are older than $MIN_AGE_DAYS days"

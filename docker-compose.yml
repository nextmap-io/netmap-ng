# Development setup with local builds and live reload
# Usage:
#   1. Copy .env.example to .env and configure
#   2. docker compose up -d
#
# Backend: source mounted for live reload (uvicorn --reload)
# Frontend: source mounted with Vite dev server (HMR)

networks:
  app:
    driver: bridge
  internal:
    driver: bridge
    internal: true

services:
  # FastAPI backend with live reload
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      # Mount source code for live reload during development
      - ./backend/app:/app/app
      # Persistent storage for SQLite database
      - app-data:/app/data
      # Mount Observium RRD directory (read-only)
      # Uncomment and adjust the path to your Observium RRD directory:
      # - /opt/observium/rrd:/rrd:ro
    networks:
      - app
      - internal
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # React frontend with Vite dev server (HMR)
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      # Mount source code for hot module replacement
      - ./frontend/src:/app/src
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - app

  # Redis for session storage and caching (internal-only — no host port)
  redis:
    image: redis:7-alpine
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  app-data:

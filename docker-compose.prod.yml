# Production deployment using pre-built images from GHCR
# Usage:
#   1. Copy .env.example to .env and configure
#   2. docker compose -f docker-compose.prod.yml up -d
#
# The frontend serves static files via nginx on port 8080 internally.
# Put a reverse proxy (nginx/caddy/traefik) in front for HTTPS.

networks:
  app:
    driver: bridge
  internal:
    driver: bridge
    internal: true

services:
  backend:
    image: ghcr.io/nextmap-io/netmap-ng-backend:latest
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    volumes:
      - app-data:/app/data
      # Mount Observium RRD directory (read-only)
      # Uncomment and adjust the path to your Observium RRD directory:
      # - /opt/observium/rrd:/rrd:ro
    networks:
      - app
      - internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: ghcr.io/nextmap-io/netmap-ng-frontend:latest
    ports:
      - "127.0.0.1:3000:8080"
    networks:
      - app
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  app-data:
